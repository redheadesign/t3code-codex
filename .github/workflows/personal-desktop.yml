name: Build personal desktop releases
on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop release version (without the v prefix)
        required: true
        type: string
      platform:
        description: Platforms to build
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux
      publish:
        description: Publish the complete desktop release from main
        type: boolean
        default: false
      reuse_run:
        description: Completed main build run ID to publish with an existing version tag
        type: string
        required: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.targets.outputs.version }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Resolve build targets
        id: targets
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ inputs.platform }}
          PUBLISH: ${{ inputs.publish }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';

          const { VERSION, PLATFORM, PUBLISH, REUSE_RUN, GITHUB_REF, GITHUB_OUTPUT } = process.env;
          if (REUSE_RUN && PUBLISH !== 'true') {
            throw new Error('Reusing a build requires publishing.');
          }
          if (PUBLISH === 'true' && (PLATFORM !== 'all' || GITHUB_REF !== 'refs/heads/main')) {
            throw new Error('Publishing requires all platforms and the main branch.');
          }
          if (!/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(VERSION)) {
            throw new Error('Enter a desktop release version such as 0.1.9-codex.20261115.5.');
          }

          const targets = [
            ['macos', 'mac', 'arm64', 'macos-15', 'dmg', 'aarch64-apple-darwin', 'macOS Apple Silicon'],
            ['macos', 'mac', 'x64', 'macos-15-intel', 'dmg', 'x86_64-apple-darwin', 'macOS Intel'],
            ['windows', 'win', 'x64', 'windows-2025', 'nsis', 'x86_64-pc-windows-msvc', 'Windows x64'],
            ['windows', 'win', 'arm64', 'windows-11-arm', 'nsis', 'aarch64-pc-windows-msvc', 'Windows ARM64'],
            ['linux', 'linux', 'x64', 'ubuntu-24.04', 'AppImage', 'x86_64-unknown-linux-gnu', 'Linux x64'],
            ['linux', 'linux', 'arm64', 'ubuntu-24.04-arm', 'AppImage', 'aarch64-unknown-linux-gnu', 'Linux ARM64'],
          ];
          const include = targets
            .filter(([group]) => PLATFORM === 'all' || PLATFORM === group)
            .map(([, platform, arch, runner, target, rust_target, label]) => ({
              platform, arch, runner, target, rust_target, label,
            }));
          if (include.length === 0) throw new Error('Unknown desktop build platform.');
          appendFileSync(GITHUB_OUTPUT, 'version=' + VERSION + '\nmatrix=' + JSON.stringify({ include }) + '\n');
          JS

  build:
    name: ${{ matrix.label }}
    if: inputs.reuse_run == ''
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_TELEMETRY_ENABLED: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/desktop... --filter t3... --filter @t3tools/web... --filter @t3tools/monorepo --filter @t3tools/scripts...
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - name: Install Linux packaging and launch dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get install -y imagemagick
          fi
      - name: Build installer and validate packaged runtime
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          vp run dist:desktop:artifact --platform "$PLATFORM" --target "$TARGET" --arch "$ARCH" \
            --build-version "$RELEASE_VERSION" --output-dir release --keep-stage --verbose
      - name: Launch packaged app with isolated test data
        env:
          PLATFORM: ${{ matrix.platform }}
          DEBUG: pw:browser
        run: |
          set -euo pipefail
          check=(env -u ELECTRON_RUN_AS_NODE node --unhandled-rejections=warn scripts/smoke-desktop-app.ts --artifacts-dir desktop-launch-check)
          case "$PLATFORM" in
            mac)
              images=(release/*.dmg)
              test "${#images[@]}" -eq 1
              mount="$RUNNER_TEMP/desktop-launch-dmg"
              hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${images[0]}"
              trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
              apps=("$mount"/*.app)
              test "${#apps[@]}" -eq 1
              app="${apps[0]}"
              executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
              "${check[@]}" --executable "$app/Contents/MacOS/$executable"
              ;;
            linux)
              images=("$PWD"/release/*.AppImage)
              test "${#images[@]}" -eq 1
              chmod +x "${images[0]}"
              (cd "$RUNNER_TEMP" && "${images[0]}" --appimage-extract >/dev/null)
              xvfb-run -a "${check[@]}" --executable "$RUNNER_TEMP/squashfs-root/t3code"
              ;;
            win)
              executable=$(node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';

          const releases = fs.globSync('t3code-desktop-win-stage-*/app/dist/win*-unpacked/T3 Code*.exe', {
            cwd: os.tmpdir(),
          });
          if (releases.length !== 1) throw new Error('Expected one packaged T3 Code executable.');
          console.log(path.join(os.tmpdir(), releases[0]));
          JS
              )
              "${check[@]}" --executable "$executable"
              ;;
          esac
      - name: Create checksums
        env:
          ARTIFACT_TARGET: ${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const files = fs.readdirSync('release')
            .filter(name => /\.(dmg|zip|exe|blockmap|AppImage|deb)$/.test(name) || /^latest.*\.yml$/.test(name))
            .sort();
          if (!files.length) throw new Error('No release assets to hash.');
          const checksums = files.map(name => {
            const digest = crypto.createHash('sha256').update(fs.readFileSync('release/' + name)).digest('hex');
            return digest + '  ' + name;
          });
          fs.writeFileSync('release/SHA256SUMS-' + process.env.ARTIFACT_TARGET + '.txt', checksums.join('\n') + '\n');
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS-*.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: launch-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-launch-check/
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    if: >-
      !cancelled() && inputs.publish && github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || (inputs.reuse_run != '' && needs.build.result == 'skipped'))
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency: desktop-release-publish
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/scripts...
      - name: Resolve build provenance
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          set -euo pipefail
          if [[ -z "$REUSE_RUN" ]]; then
            printf 'run_id=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$REUSE_RUN" =~ ^[1-9][0-9]*$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN")
          jq -e '
            .path == ".github/workflows/personal-desktop.yml" and
            .head_branch == "main" and .event == "workflow_dispatch" and .status == "completed"
          ' <<< "$run" > /dev/null
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN/jobs?per_page=100")
          jq -e '
            ([.jobs[] | select(.conclusion == "success") | .name] | sort) as $passed |
            (["Linux ARM64", "Linux x64", "Windows ARM64", "Windows x64", "macOS Apple Silicon", "macOS Intel"] - $passed) == []
          ' <<< "$jobs" > /dev/null
          commit=$(jq -r .head_sha <<< "$run")
          if ! tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha) || [[ "$tag_commit" != "$commit" ]]; then
            printf 'Tag v%s must point to build commit %s\n' "$VERSION" "$commit" >&2
            exit 1
          fi
          printf 'run_id=%s\ncommit=%s\n' "$REUSE_RUN" "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ inputs.reuse_run != '' && github.token || '' }}
      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release

          copy_asset() {
            local target="$1" filename="$2"
            local source="installers/installers-$target/$filename"
            if [[ ! -s "$source" ]]; then
              printf 'Missing release asset %s\n' "$source" >&2
              return 1
            fi
            cp -- "$source" "release/$filename"
          }

          for arch in x64 arm64; do
            name="T3-Code-$VERSION-$arch"
            copy_asset "mac-$arch" "$name.dmg"
            copy_asset "mac-$arch" "$name.zip"
            copy_asset "win-$arch" "$name.exe"
            copy_asset "win-$arch" "$name.exe.blockmap"
            appimage_arch="$arch"
            deb_arch="$arch"
            if [[ "$arch" == x64 ]]; then
              appimage_arch=x86_64
              deb_arch=amd64
            fi
            copy_asset "linux-$arch" "T3-Code-$VERSION-$appimage_arch.AppImage"
            copy_asset "linux-$arch" "T3-Code-$VERSION-$deb_arch.deb"
          done

          copy_asset linux-x64 latest-linux.yml
          copy_asset linux-arm64 latest-linux-arm64.yml
          node scripts/merge-update-manifests.ts --platform win \
            installers/installers-win-x64/latest.yml \
            installers/installers-win-arm64/latest.yml \
            release/latest.yml

          for manifest in release/latest*.yml; do
            grep -Fx -e "version: $VERSION" -e "version: '$VERSION'" "$manifest"
          done
          grep -F "T3-Code-$VERSION-x64.exe" release/latest.yml
          grep -F "T3-Code-$VERSION-arm64.exe" release/latest.yml
          grep -F "T3-Code-$VERSION-x86_64.AppImage" release/latest-linux.yml
          grep -F "T3-Code-$VERSION-amd64.deb" release/latest-linux.yml
          grep -F "T3-Code-$VERSION-arm64.AppImage" release/latest-linux-arm64.yml
          grep -F "T3-Code-$VERSION-arm64.deb" release/latest-linux-arm64.yml

          (cd release && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" && sha256sum -c "$RUNNER_TEMP/SHA256SUMS")
          cp -- "$RUNNER_TEMP/SHA256SUMS" release/SHA256SUMS
      - name: Publish installers and release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ steps.source.outputs.run_id }}
          BUILD_SHA: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          downloads="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION"

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Desktop downloads

          | Platform | x64 / Intel | ARM64 / Apple Silicon |
          | --- | --- | --- |
          | macOS | [Intel DMG]($downloads/T3-Code-$VERSION-x64.dmg) | [Apple Silicon DMG]($downloads/T3-Code-$VERSION-arm64.dmg) |
          | Windows | [x64 installer]($downloads/T3-Code-$VERSION-x64.exe) | [ARM64 installer]($downloads/T3-Code-$VERSION-arm64.exe) |
          | Linux | [AppImage]($downloads/T3-Code-$VERSION-x86_64.AppImage) · [DEB]($downloads/T3-Code-$VERSION-amd64.deb) | [AppImage]($downloads/T3-Code-$VERSION-arm64.AppImage) · [DEB]($downloads/T3-Code-$VERSION-arm64.deb) |

          This release brings the fork’s glass workspace, interactive ASCII animals, and appearance controls to all six desktop targets.

          macOS uses manual installation and updates. These installers are distributed without Apple Developer ID notarization.

          [SHA-256 checksums]($downloads/SHA256SUMS) · [Build and launch checks]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN)
          EOF

          gh release create "v$VERSION" release/* \
            --target "$BUILD_SHA" \
            --title "T3 Code by redheadesign $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
